name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Surge
        run: npm install -g surge

      - name: Publicar
        run: surge ./ yendry-pcstore.surge.sh --token ${{ secrets.SURGE_TOKEN }}